---
version: '3'

tasks:
  lint:
    desc: Check Python code with Ruff
    silent: true
    cmds:
      - uv run ruff check .

  test:
    desc: Run the test suite
    silent: true
    cmds:
      - uv run pytest

  cleanup:
    desc: Cleanup the Python project
    silent: true
    cmds:
      - rm -fr .venv
      - rm -fr .ruff_cache .pytest_cache
      - find . -type f -iname *.pyc -delete
      - find . -type d -iname __pycache__ -delete
...
